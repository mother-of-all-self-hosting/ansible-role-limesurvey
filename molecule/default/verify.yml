---
- name: Verify LimeSurvey systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for LimeSurvey service to become active (up to 180s)
      ansible.builtin.systemd:
        name: limesurvey.service
      register: limesurvey_service
      until: limesurvey_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert LimeSurvey service is active
      ansible.builtin.assert:
        that: limesurvey_service.status.ActiveState == 'active'
        fail_msg: "limesurvey.service not active ({{ limesurvey_service.status.ActiveState }})"
        success_msg: "limesurvey.service is active"

    - name: Retrieve LimeSurvey service log for debugging
      when: limesurvey_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu limesurvey.service
      changed_when: false

    - name: Wait for LimeSurvey HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:80/index.php/admin"
        method: GET
        status_code: [200, 302, 307]
        follow_redirects: none
      register: limesurvey_endpoint
      until: limesurvey_endpoint.status in [200, 302, 307]
      retries: 120
      delay: 5

    - name: Assert LimeSurvey HTTP endpoint responds
      ansible.builtin.assert:
        that: limesurvey_endpoint.status in [200, 302, 307]
        fail_msg: "LimeSurvey did not respond as expected ({{ limesurvey_endpoint.status | default('no response') }})"
        success_msg: "LimeSurvey responded with {{ limesurvey_endpoint.status }}"

    - name: Show LimeSurvey systemd service status summary
      ansible.builtin.debug:
        msg:
          - "LimeSurvey systemd: {{ limesurvey_service.status.ActiveState }}"
          - "LimeSurvey HTTP: {{ limesurvey_endpoint.status }}"
